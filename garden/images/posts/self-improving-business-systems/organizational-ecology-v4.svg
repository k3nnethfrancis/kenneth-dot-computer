    <circle class="open" cx="292" cy="220" r="8"/>
    <circle class="solid" cx="320" cy="270" r="7"/>
    <circle class="open" cx="285" cy="318" r="8"/>
    <circle class="solid" cx="229" cy="307" r="7"/>
    <circle class="solid" cx="247" cy="260" r="7"/>
    <circle class="open" cx="196" cy="273" r="8"/>
