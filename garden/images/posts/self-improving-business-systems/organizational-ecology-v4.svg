<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">The business unit inside an organizational hierarchy</title>
  <desc id="desc">A network becomes increasingly connected from individuals through teams and business units to the organization, then opens into a sparse environment. The business unit is highlighted as the bounded system that owns an outcome.</desc>
  <style>
    .edge { fill: none; stroke: #002b36; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .bridge { fill: none; stroke: #002b36; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .open { fill: #fdf6e3; stroke: #002b36; stroke-width: 1.7; vector-effect: non-scaling-stroke; }
    .solid { fill: #002b36; stroke: #002b36; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .label { fill: #002b36; font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 22px; font-weight: 600; letter-spacing: 1.8px; text-anchor: middle; }
    .note { fill: #002b36; font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 14px; font-weight: 650; letter-spacing: 1.1px; text-anchor: middle; }
    .focus { fill: none; stroke: #002b36; stroke-width: 1.9; stroke-dasharray: 7 8; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  </style>

  <!-- Individuals: discrete actors -->
  <g>
