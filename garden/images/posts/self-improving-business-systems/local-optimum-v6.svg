  </g>

  <!-- Incremental optimization loops around the current regime. -->
  <path class="loop" d="M356 246 C311 233 285 265 294 303 C302 338 340 355 377 337 C406 323 410 279 384 258" marker-end="url(#arrow)"/>
  <text class="note" x="92" y="268">INCREMENTAL IMPROVEMENT</text>
  <path class="leader" d="M274 271 L295 282"/>

  <!-- The escape path has to descend before it can reach a better regime. -->
  <path class="route" d="M391 300 C472 342 549 419 636 419 C718 418 757 342 847 209" marker-end="url(#arrow)"/>
  <circle class="waypoint" cx="521" cy="384" r="6"/>
  <circle class="waypoint" cx="636" cy="419" r="6"/>
  <text class="note" x="480" y="550">REDESIGN THE WORK SYSTEM</text>

  <circle class="system" cx="390" cy="300" r="10"/>
  <path class="leader" d="M390 287 L390 198"/>
  <text class="label" x="264" y="164">LOCAL REGIME</text>
  <text class="note" x="270" y="188">CURRENT BUSINESS SYSTEM</text>

  <circle class="waypoint" cx="847" cy="209" r="9"/>
  <path class="leader" d="M856 199 L910 112"/>
  <text class="label" x="902" y="70">HIGHER-PERFORMING</text>
  <text class="label" x="902" y="94">REGIME</text>
</svg>
