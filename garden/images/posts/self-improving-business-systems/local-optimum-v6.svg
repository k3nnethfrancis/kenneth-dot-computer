  <!-- Contours make the two regimes legible at a glance. -->
  <g aria-hidden="true">
    <path class="contour" d="M270 403 C272 346 307 285 354 254 C399 224 453 241 479 291 C504 340 476 392 426 414 C371 438 305 431 270 403 Z"/>
    <path class="contour" d="M306 379 C309 333 334 293 370 273 C406 253 443 271 458 307 C475 348 450 381 414 394 C370 410 329 402 306 379 Z"/>
    <path class="contour" d="M339 356 C343 322 359 295 384 283 C410 271 432 288 438 314 C446 342 428 362 403 369 C376 377 352 370 339 356 Z"/>
