<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Escaping a local regime</title>
  <desc id="desc">A monochrome wireframe landscape shows a current business system on a small local peak, a valley that must be crossed through redesign, and a higher-performing regime beyond it.</desc>
  <style>
    .mesh, .contour, .route, .loop, .leader {
      fill: none;
      stroke: #002b36;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .mesh { stroke-width: 1.25; opacity: .72; }
    .contour { stroke-width: 1.6; }
    .route { stroke-width: 2.5; }
    .loop { stroke-width: 1.7; stroke-dasharray: 5 7; }
    .leader { stroke-width: 1.1; }
    .system { fill: #002b36; }
    .waypoint { fill: #fdf6e3; stroke: #002b36; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .label { fill: #002b36; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 18px; font-weight: 700; letter-spacing: 1.7px; }
    .note { fill: #002b36; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; letter-spacing: 1px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#002b36"/>
    </marker>
  </defs>

  <!-- A projected field whose grid rises around two possible operating regimes. -->
  <g aria-hidden="true">
