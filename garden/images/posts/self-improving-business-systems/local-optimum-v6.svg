    <path class="mesh" d="M546 442 C570 409 592 376 613 353 C634 329 654 327 674 347 C695 367 709 391 722 414 C741 449 756 468 778 478 C800 488 819 468 829 439"/>
    <path class="mesh" d="M638 428 C662 399 684 373 705 352 C729 326 748 304 769 271 C790 237 813 189 841 169 C864 153 887 165 904 198 C931 250 939 312 961 354 C979 389 1002 413 1035 427"/>
    <path class="mesh" d="M736 414 C758 382 779 344 798 300 C816 258 834 191 858 144 C876 109 899 102 921 129 C952 168 967 252 980 319 C989 367 1010 405 1060 443"/>
