<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">A legible learning system</title>
  <desc id="desc">A business network becomes legible to an agent when an external trigger, internal checks, and outcome signals attach to the work. Evidence from each run remains in the network for the next.</desc>
  <style>
    .edge, .learning, .leader { fill: none; stroke: #002b36; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .edge { stroke-width: 1.55; }
    .spine { stroke-width: 2.15; }
    .learning { stroke-width: 1.7; stroke-dasharray: 6 8; }
    .leader { stroke-width: 1.15; }
    .human { fill: #002b36; }
    .record { fill: #fdf6e3; stroke: #002b36; stroke-width: 1.8; vector-effect: non-scaling-stroke; }
    .signal, .agent { fill: #fdf6e3; stroke: #002b36; vector-effect: non-scaling-stroke; }
    .signal { stroke-width: 2.25; }
    .agent { stroke-width: 2.55; }
    .label { fill: #002b36; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 19px; font-weight: 700; letter-spacing: 1.65px; text-anchor: middle; }
    .note { fill: #002b36; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 14px; font-weight: 600; letter-spacing: 1px; text-anchor: middle; }
    .micro { fill: #002b36; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; letter-spacing: .9px; text-anchor: middle; }
  </style>

  <text class="label" x="600" y="58">A LEGIBLE LEARNING SYSTEM</text>
  <text class="note" x="600" y="85">SIGNALS MAKE THE WORK AVAILABLE FOR ITERATION</text>

  <!-- The operating environment: a graph of tools, records, and human-held work. -->
  <path class="edge" d="M218 280 L283 177 L382 205 L425 297 L360 378 L252 368 L218 280 M283 177 L360 378 M382 205 L252 368"/>
  <path class="edge spine" d="M360 378 L521 326"/>
  <circle class="record" cx="218" cy="280" r="9"/><circle class="record" cx="283" cy="177" r="10"/><circle class="record" cx="382" cy="205" r="9"/><circle class="record" cx="425" cy="297" r="10"/><circle class="record" cx="252" cy="368" r="9"/>
  <circle class="human" cx="360" cy="378" r="15"/>

  <path class="edge" d="M521 326 L557 210 L650 164 L741 214 L760 318 L687 382 L600 368 L521 326 M557 210 L687 382 M650 164 L760 318 M600 368 L687 382"/>
  <circle class="record" cx="557" cy="210" r="9"/><circle class="record" cx="650" cy="164" r="10"/><circle class="record" cx="741" cy="214" r="9"/><circle class="record" cx="760" cy="318" r="10"/><circle class="record" cx="687" cy="382" r="9"/><circle class="record" cx="600" cy="368" r="9"/>
  <circle class="agent" cx="544" cy="348" r="25"/><circle class="human" cx="544" cy="348" r="5"/>

  <path class="edge spine" d="M687 382 L816 358"/>
  <path class="edge" d="M816 358 L800 244 L864 175 L962 206 L994 307 L933 384 L816 358 M800 244 L933 384 M864 175 L994 307"/>
  <circle class="record" cx="800" cy="244" r="9"/><circle class="record" cx="864" cy="175" r="10"/><circle class="record" cx="962" cy="206" r="9"/><circle class="record" cx="994" cy="307" r="10"/><circle class="record" cx="933" cy="384" r="9"/>
  <circle class="human" cx="816" cy="358" r="15"/>

  <!-- A few durable signal nodes turn a human-shaped network into a learnable one. -->
  <circle class="signal" cx="112" cy="280" r="16"/><circle class="signal" cx="112" cy="280" r="6"/>
  <path class="edge spine" d="M128 280 H209"/>
  <text class="note" x="112" y="318">TRIGGER</text>

  <circle class="signal" cx="742" cy="452" r="16"/><circle class="signal" cx="742" cy="452" r="6"/>
  <path class="edge spine" d="M730 441 L697 392"/>
  <text class="note" x="742" y="489">CHECK</text>

  <circle class="signal" cx="1085" cy="242" r="17"/><circle class="signal" cx="1085" cy="242" r="7"/>
  <path class="edge spine" d="M1008 296 L1069 251"/>
  <text class="note" x="1085" y="280">OUTCOME</text>

  <!-- Outcome evidence remains connected to the next run rather than disappearing into a report. -->
  <path class="learning" d="M1085 263 C1096 461 924 518 687 506 C425 493 169 470 134 327 C128 305 145 284 203 280"/>
  <text class="note" x="600" y="534">EVIDENCE FROM ONE RUN BECOMES SIGNAL FOR THE NEXT</text>
</svg>
