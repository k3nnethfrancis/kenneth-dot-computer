<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Human judgment moves outward</title>
  <desc id="desc">Three exact concentric scopes show human responsibility moving outward: a builder shapes an agent at the center, an evaluator shapes the feedback loop around it, and an architect shapes the larger business system.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#002b36"/></marker>
  </defs>
  <style>
    .scope,.leader { fill:none; stroke:#002b36; stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; }
    .scope { stroke-width:1.65; stroke-dasharray:6 9; }
    .leader { stroke-width:1.25; marker-end:url(#arrow); }
    .human { fill:#002b36; }
    .agent,.node { fill:#fdf6e3; stroke:#002b36; vector-effect:non-scaling-stroke; }
    .agent { stroke-width:2.7; }
    .node { stroke-width:1.7; }
    .label { fill:#002b36; font-family:"IBM Plex Mono", "Courier New", monospace; font-size:20px; font-weight:700; letter-spacing:1.6px; text-anchor:middle; }
    .note { fill:#002b36; font-family:"IBM Plex Mono", "Courier New", monospace; font-size:14px; font-weight:600; letter-spacing:1.05px; text-anchor:middle; }
    .scope-label { fill:#002b36; font-family:"IBM Plex Mono", "Courier New", monospace; font-size:13px; font-weight:700; letter-spacing:1.25px; text-anchor:middle; }
  </style>

  <text class="label" x="600" y="50">HUMAN JUDGMENT MOVES OUTWARD</text>

  <!-- Exact nested scopes. Each human marker sits on the boundary it governs. -->
  <circle class="scope" cx="600" cy="330" r="82"/>
  <circle class="scope" cx="600" cy="330" r="164"/>
  <circle class="scope" cx="600" cy="330" r="246"/>
  <text class="scope-label" x="600" y="235">AGENT WORK</text>
  <text class="scope-label" x="600" y="154">FEEDBACK LOOP</text>
  <text class="scope-label" x="600" y="604">BUSINESS SYSTEM</text>

  <!-- The operating core stays deliberately small. -->
  <circle class="agent" cx="600" cy="330" r="28"/>
  <circle class="human" cx="600" cy="330" r="4"/>
  <text class="note" x="600" y="375">AGENT</text>

  <!-- The judge names the feedback layer without competing with the role callouts. -->
  <circle class="node" cx="710" cy="330" r="15"/>
  <text class="scope-label" x="710" y="359">JUDGE</text>

  <!-- People visibly move from the core to the feedback layer to the system boundary. -->
  <circle class="human" cx="518" cy="330" r="12"/>
  <path class="leader" d="M302 326 L502 330"/>
  <text class="label" x="207" y="319">BUILDER</text>
  <text class="note" x="207" y="345">SHAPES AGENT</text>

  <circle class="human" cx="716" cy="214" r="12"/>
  <path class="leader" d="M939 163 L723 319"/>
  <text class="label" x="1015" y="150">EVALUATOR</text>
  <text class="note" x="1015" y="176">SHAPES JUDGE</text>

  <circle class="human" cx="426" cy="504" r="12"/>
  <path class="leader" d="M291 554 L414 511"/>
  <text class="label" x="196" y="566">ARCHITECT</text>
  <text class="note" x="196" y="592">SHAPES SYSTEM</text>
</svg>
